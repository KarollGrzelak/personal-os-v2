<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal OS</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">Przejdź do treści</a>
<div class="bgfx" aria-hidden="true"></div>
<div class="app-shell">
  <header class="app-header">
    <div class="product-brand">Personal OS</div>
    <div class="app-header-content">
      <p class="app-date" id="app-date"></p>
      <h1 id="app-view-title" tabindex="-1">Dziś</h1>
      <p class="app-context" id="app-view-context">Twój plan i działania na dzisiaj</p>
    </div>
    <button class="menu-button" id="menu-open" type="button" aria-expanded="false" aria-controls="app-nav-panel">Menu</button>
  </header>

  <div class="app-frame">
    <aside class="app-sidebar" id="app-nav-panel" aria-hidden="true" inert hidden>
      <div class="app-sidebar-header">
        <span class="app-sidebar-title">Nawigacja</span>
        <button class="menu-close-button" id="menu-close" type="button">Zamknij menu</button>
      </div>
      <nav class="nav" id="nav" aria-label="Główna nawigacja"></nav>
    </aside>
    <button class="nav-backdrop" id="nav-backdrop" type="button" aria-label="Zamknij menu" tabindex="-1" hidden></button>

    <main class="wrap" id="main-content" tabindex="-1">
      <div class="view active" id="view-dzis"></div>
      <div class="view" id="view-settings"></div>
    </main>
  </div>
</div>

<script src="./src/core.js"></script>
<script src="./src/today.js"></script>
<script src="./src/training.js"></script>
<script src="./src/learning.js"></script>
<script src="./src/school.js"></script>
<script src="./src/availability.js"></script>
<script src="./src/english.js"></script>
<script src="./src/plan-day.js"></script>
<script src="./src/backup.js"></script>
<script src="./src/app.js"></script>
</body>
</html>
